version: '3.9'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: easeit
      POSTGRES_USER: easeit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://easeit:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}@db:5432/easeit
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      JWT_ALGORITHM: HS256
      OLLAMA_URL: http://host.docker.internal:11434
      LLM_MODEL: llama3.2:3b
      FRONTEND_ORIGIN: http://localhost:5173
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL-}
      N8N_WEBHOOK_TOKEN: ${N8N_WEBHOOK_TOKEN:-}
    ports:
      - "8000:8000"
    depends_on:
      - db
      - mailhog
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
